<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMIN</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./component/Formulaire/style.css" />
    <link rel="stylesheet" href="./component/ProfilForm/style.css" />
    <link rel="stylesheet" href="./component/FeaturedManager/style.css" />
  </head>
  <body>
    <section id="log"></section>
    <section id="profile"></section>
    <section id="movie"></section>
    <section id="featured"></section>

    <script type="module">
      // Capture les erreurs non gérées
      window.addEventListener('error', (event) => {
        console.error('Erreur non gérée:', event.error);
        console.error('Message:', event.message);
        console.error('Stack:', event.error?.stack);
      });

      window.addEventListener('unhandledrejection', (event) => {
        console.error('Promise rejection non gérée:', event.reason);
        console.error('Stack:', event.reason?.stack);
      });
      import { Log } from "./component/Log/script.js";
      import { Formulaire } from "./component/Formulaire/script.js";
      import { ProfileForm } from "./component/ProfilForm/script.js";
      import { FeaturedManager } from "./component/FeaturedManager/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";

      window.C = {};

      C.start = function () {
        V.renderLog("Démarrage de l'application");
        V.renderProfileForm();
        V.renderForm();
        V.renderFeaturedManager();
      };

      C.handlerSearchFeatured = async function(keyword) {
        const resultsContainer = document.querySelector('#featured-results');
        if (!keyword || keyword.trim() === '') {
          if (resultsContainer) {
            resultsContainer.innerHTML = '<p class="featured-search__placeholder">Tapez un titre pour lancer la recherche.</p>';
          }
          return;
        }
        const movies = await DataMovie.searchMovies(keyword);
        if (!resultsContainer) return;
        V.renderFeaturedResults(movies);
      };

      C.handlerToggleFeatured = async function(movieId, currentlyFeatured) {
        const newStatus = !currentlyFeatured;
        const result = await DataMovie.updateFeatured(movieId, newStatus);
        if (result.success) {
          V.renderLog(result.message);
          // Refresh search results
          const input = document.querySelector('.featured-search__input');
          if (input && input.value) {
            C.handlerSearchFeatured(input.value);
          }
        } else {
          V.renderLog('Erreur : ' + (result.message || 'Impossible de mettre à jour le statut'));
        }
      };

      window.V = {};

      V.renderLog = function (txt) {
        let content = document.querySelector("#log");
        content.innerHTML = Log.format(txt);
      };

      V.renderForm = async function () {
        let categories = await DataMovie.getCategories();
        let genresHtml = categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
        let formSection = document.querySelector('#movie');
        formSection.innerHTML = Formulaire.format(genresHtml);
        const formElement = formSection.querySelector('#movie-form');
        if (formElement) {
          formElement.addEventListener('submit', event => Formulaire.submitForm(event, DataMovie.addMovie));
        }
      };
      
      V.renderProfileForm = async function () {
        let profiles = await DataProfile.getAll();
        let profileSection = document.querySelector('#profile');
        profileSection.innerHTML = ProfileForm.format(profiles);
        const profileForm = profileSection.querySelector('#profile-form');
        const profileSelect = profileSection.querySelector('#profile-select');
        
        if (profileSelect) {
          profileSelect.addEventListener('change', async function() {
            if (this.value) {
              const profile = profiles.find(p => p.id == this.value);
              ProfileForm.loadProfile(profile, profileForm);
            } else {
              ProfileForm.resetForm(profileForm);
            }
          });
        }
        
        if (profileForm) {
          profileForm.addEventListener('submit', event => ProfileForm.submitForm(event, DataProfile.add, DataProfile.update));
        }
      };

      V.renderFeaturedManager = function() {
        let section = document.querySelector('#featured');
        if (!section) return;
        section.innerHTML = FeaturedManager.format();
      };

      V.renderFeaturedResults = function(movies) {
        let resultsContainer = document.querySelector('#featured-results');
        if (!resultsContainer) return;
        resultsContainer.innerHTML = FeaturedManager.formatResults(movies);
      };
      

      C.start();
    </script>
  </body>
</html>
