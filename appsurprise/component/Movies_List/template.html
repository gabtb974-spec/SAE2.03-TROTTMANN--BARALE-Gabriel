<li class="movies__item" onclick="{{hSelectMovie}}">
  <div class="movies__card">
    <img src="{{image}}" alt="{{name}}" class="movies__image" />
    <div class="movies__overlay">
      <span class="movies__title">{{name}}</span>
    </div>
  </div>
  <div class="movies__actions">{{favoriteButton}}</div>
</li>
