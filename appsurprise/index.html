<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css?v=1" />
  </head>

  <body>
    <div class="app-container">
      <main class="app-main">
        <header id="topbar"></header>
        <section id="content"></section>
        <footer id="page-footer" class="app-footer"></footer>
      </main>
    </div>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";
      import { FeaturedSection } from "./component/FeaturedSection/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { DataFavorite } from "./data/dataFavorite.js";
      import { InfoFilms } from "./component/Info_Films/script.js";
      import { Stats } from "./component/Stats/script.js";
      import { Footer } from "./component/Footer/script.js";
      import { DataStats } from "./data/dataStats.js";

      window.C = {};
      C.activeProfile = null;
      C.profiles = [];
      C.favorites = [];


      C.handlerAbout = function() {
        if (window.statsInterval) clearInterval(window.statsInterval);
        alert("Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !");
      };

      C.handlerListe = function() {
        if (window.statsInterval) clearInterval(window.statsInterval);
        C.loadMovies();
      };

      C.handlerStats = async function() {
        const stats = await DataStats.requestStats();
        V.renderStats(stats);
        if (window.statsInterval) clearInterval(window.statsInterval);
        window.statsInterval = setInterval(async () => {
          const newStats = await DataStats.requestStats();
          V.renderStats(newStats);
        }, 30000);
      };

      C.handlerSearch = async function(keyword) {
        if (window.statsInterval) clearInterval(window.statsInterval);
        if (!keyword || keyword.trim() === '') {
          C.loadMovies();
          return;
        }
        const age = C.activeProfile ? C.activeProfile.min_age : 100;
        const results = await DataMovie.searchMovies(keyword, age);
        results.forEach(movie => {
          movie.isFavorited = C.favorites.includes(String(movie.id));
        });
        V.renderSearchResults(results, keyword);
      };

      C.handlerSelectMovie = function(movieId) {
        C.showMovieInfo(movieId);
      };

      C.handlerSelectProfile = async function(profileId) {
        const profile = C.profiles.find(p => p.id == profileId);
        if (!profile) return;
        C.activeProfile = profile;
        C.closeNavbarProfileMenu();
        await C.loadFavorites();
        C.loadMovies();
      };

      C.loadFavorites = async function() {
        if (!C.activeProfile) {
          C.favorites = [];
          return [];
        }
        const favorites = await DataFavorite.read(C.activeProfile.id);
        C.favorites = favorites.map(movie => String(movie.id));
        return favorites;
      };

      C.handlerToggleFavorite = async function(movieId) {
        if (!C.activeProfile) {
          alert('Choisissez un profil pour ajouter un favori.');
          return;
        }
        if (C.favorites.includes(String(movieId))) {
          alert('Ce film est déjà dans vos favoris.');
          return;
        }
        const result = await DataFavorite.add(C.activeProfile.id, movieId);
        if (result.success) {
          alert(result.message);
          await C.loadFavorites();
          C.loadMovies();
        } else {
          alert(result.message || 'Erreur lors de l\'ajout aux favoris.');
        }
      };

      C.openProfileChooser = async function() {
        const menu = document.querySelector('.navbar__profile-menu');
        if (menu && menu.classList.contains('show')) {
          C.closeNavbarProfileMenu();
          return;
        }
        C.closeProfileMenu();
        C.profiles = await DataProfile.read();
        V.updateNavbarProfileMenu(C.profiles);
      };

      C.closeNavbarProfileMenu = function() {
        const menu = document.querySelector('.navbar__profile-menu');
        if (menu) {
          menu.classList.remove('show');
        }
      };

      C.closeProfileMenu = function() {
        C.closeNavbarProfileMenu();
      };

      C.handlerRemoveFavorite = async function(movieId) {
        if (!C.activeProfile) {
          alert('Choisissez un profil pour retirer un favori.');
          return;
        }
        const result = await DataFavorite.remove(C.activeProfile.id, movieId);
        if (result.success) {
          alert(result.message);
          await C.loadFavorites();
          C.handlerShowFavorites(); 
        } else {
          alert(result.message || 'Erreur lors de la suppression des favoris.');
        }
      };

      C.handlerShowFavorites = async function() {
        if (window.statsInterval) clearInterval(window.statsInterval);
        if (!C.activeProfile) {
          alert('Choisissez un profil pour voir vos favoris.');
          return;
        }
        const favorites = await C.loadFavorites();
        V.renderFavorites(favorites);
      };


      C.showMovieInfo = async function(movieId) {
        if (window.statsInterval) clearInterval(window.statsInterval);
        const movie = await DataMovie.getMovieById(movieId);
        if (movie) {
          movie.isFavorited = C.favorites.includes(String(movie.id));
        }
        if (movie) V.renderInfoFilms(movie);
      };

      C.loadMovies = async function() {
        const age = C.activeProfile ? C.activeProfile.min_age : 100;
        const movies = await DataMovie.requestMovies(age);
        const featured = await DataMovie.requestFeatured(age);
        movies.forEach(movie => {
          movie.isFavorited = C.favorites.includes(String(movie.id));
        });
        featured.forEach(movie => {
          movie.isFavorited = C.favorites.includes(String(movie.id));
        });
        const featuredIds = new Set(featured.map(movie => String(movie.id)));
        const moviesWithoutFeatured = movies.filter(movie => !featuredIds.has(String(movie.id)));
        V.renderHome(featured, moviesWithoutFeatured, "C.handlerSelectMovie");
      };

      C.bindSearchInput = function() {
        const searchInput = document.querySelector('#navbar-search-input');
        if (!searchInput) return;
        searchInput.addEventListener('input', function(event) {
          C.handlerSearch(event.target.value);
        });
        searchInput.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            C.handlerSearch(event.target.value);
          }
        });
      };

      C.start = async function() {
        V.renderNavBar("C.handlerAbout()", "C.handlerListe()", "C.handlerStats()", "C.openProfileChooser()");
        V.renderFooter();
        document.addEventListener("click", function(e) {
          if (!e.target.closest('.navbar__profile-dropdown')) {
            C.closeNavbarProfileMenu();
          }
        });
        C.profiles = await DataProfile.read();
        C.loadMovies();
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */




      V.renderNavBar = function (hAbout, hListe, hStats, hProfile) {
        let topbar = document.querySelector("#topbar");
        if (!topbar) return;
        topbar.innerHTML = `
          <div class="topbar__nav">
            ${NavBar.format(hAbout, hListe, hStats, hProfile)}
          </div>
        `;
        C.bindSearchInput();
      };

      V.renderFooter = function() {
        const footer = document.querySelector('#page-footer');
        if (!footer) return;
        footer.innerHTML = Footer.format();
      };

      V.renderMovieCategories = function (movies, hSelectMovie) {
        C.closeProfileMenu();
        let content = document.querySelector("#content");
        content.innerHTML = MovieCategory.format(movies, hSelectMovie);
      };

      V.renderHome = function(featured, movies, hSelectMovie) {
        C.closeProfileMenu();
        let content = document.querySelector("#content");
        content.innerHTML = FeaturedSection.format(featured, hSelectMovie) + MovieCategory.format(movies, hSelectMovie);
        FeaturedSection.attachScrollBoundary();
      };

      V.renderStats = function(stats) {
        C.closeProfileMenu();
        let content = document.querySelector("#content");
        content.innerHTML = Stats.format(stats);
      };

      V.renderSearchResults = function(results, keyword) {
        C.closeProfileMenu();
        let content = document.querySelector("#content");
        if (results.length === 0) {
          content.innerHTML = `<h2>Résultats de recherche pour "${keyword}"</h2><p>Aucun film ne correspond à votre recherche.</p>`;
          return;
        }
        content.innerHTML = `<h2>Résultats de recherche pour "${keyword}"</h2>${MovieCategory.format(results, "C.handlerSelectMovie")}`;
      };

      V.updateNavbarProfileMenu = function(profiles) {
        const menu = document.querySelector('.navbar__profile-menu');
        if (!menu) return;
        if (!profiles || profiles.length === 0) {
          menu.innerHTML = '';
          menu.classList.remove('show');
          return;
        }
        menu.innerHTML = profiles.map(profile => {
          return `<button type="button" onclick="C.handlerSelectProfile('${profile.id}')">${profile.name}</button>`;
        }).join('');
        menu.classList.add('show');
      };


      V.renderFavorites = function (favorites) {
        let content = document.querySelector("#content");
        let title = `<h2>Mes favoris</h2>`;
        if (!favorites || favorites.length === 0) {
          content.innerHTML = `${title}<p>Votre liste de favoris est vide.</p>`;
          return;
        }
        content.innerHTML = `${title}${MovieCategory.format(favorites, "C.handlerSelectMovie", "C.handlerRemoveFavorite")}`;
      };


      V.renderInfoFilms = function (movie) {
        C.closeProfileMenu();
        let content = document.querySelector("#content");
        content.innerHTML = InfoFilms.format(movie);
      };




      C.start();
        </script>
      </body>
    </html>
