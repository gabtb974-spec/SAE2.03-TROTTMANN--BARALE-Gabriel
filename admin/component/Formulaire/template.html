<div>
    <form class="formulaire" id="movie-form" enctype="multipart/form-data">
        <label for="title">Titre du film :</label>
        <input type="text" id="title" name="title" required>
    
        <label for="director">Réalisateur :</label>
        <input type="text" id="director" name="director" required>

        <label for="release_year">Année de sortie :</label>
        <input type="number" id="release_year" name="release_year" required>

        <label for="duration">Durée :</label>
        <input type="text" id="duration" name="duration" required>

        <label for="synopsis">Synopsis :</label>
        <textarea id="synopsis" name="synopsis" rows="4" required></textarea>
    
        <label for="genre">Genre :</label>
        <select id="genre" name="genre" required>
            <option value="">Sélectionnez un genre</option>
            {{genres}}
        </select>

        <label for="poster">Affiche du film :</label>
        <input type="file" id="poster" name="poster" accept="image/*">

        <label for="trailer">Bande annonce :</label>
        <input type="text" id="trailer" name="trailer" required>

        <label for="age">Restriction d'âge :</label>
        <select id="age" name="age" required>
            <option value="">Sélectionnez une restriction</option>
            <option value="0">Tout public</option>
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="16">16</option>
            <option value="18">18</option>
        </select>

        
    
        <button type="submit">Ajouter le film</button>
    </form>
</div>
