<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css?v=1" />
  </head>

  <body>
    <div class="app-container">
      <header id="header"></header>
      <section id="content"></section>
    </div>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { InfoFilms } from "./component/Info_Films/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
        );
      };

      C.handlerSelectMovie = function (movieId) {
        C.showMovieInfo(movieId);
      };

      C.handlerListe = async function () {
        await C.loadMovies();
      };

      C.showMovieInfo = async function (movieId) {
        const movie = await DataMovie.getMovieById(movieId);
        if (!movie) {
          alert('Film introuvable.');
          return;
        }
        V.renderInfoFilms(movie);
      };

      C.start = async function () {
        V.renderNavBar("C.handlerAbout()", "C.handlerListe()");
        await C.loadMovies();
      };

      C.loadMovies = async function () {
        const movies = await DataMovie.requestMovies();
        V.renderMovieCategories(movies, "C.handlerSelectMovie");
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */




      V.renderNavBar = function (hAbout, hListe) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout, hListe);
      };

      V.renderMovieCategories = function (movies, hSelectMovie) {
        let content = document.querySelector("#content");
        content.innerHTML = MovieCategory.format(movies, hSelectMovie);
      };

      V.renderInfoFilms = function (movie) {
        let content = document.querySelector("#content");
        content.innerHTML = InfoFilms.format(movie);
      };




      C.start();
    </script>
  </body>
</html>
<script type="module"></script>
